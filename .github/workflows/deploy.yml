name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for dependency linting
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies for validation
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate FastAPI app syntax
        run: python -m py_compile app/main.py

      - name: Ensure Docker Compose config is valid
        run: docker compose config

      - name: Sync repository to target server
        uses: appleboy/scp-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: '.'
          target: '${{ secrets.SERVER_DEPLOY_PATH }}'

      - name: Run deploy script on target server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh

name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for dependency linting
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies for validation
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate FastAPI app syntax
        run: python -m py_compile app/main.py

      - name: Create .env file from secrets
        run: |
          cat > .env <<EOF
          APP_ENV=${{ secrets.APP_ENV || 'production' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          REDIS_HOST=${{ secrets.REDIS_HOST || 'redis' }}
          REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}
          SSL_DOMAIN=${{ secrets.SSL_DOMAIN || '' }}
          DEPLOY_PATH=${{ secrets.DEPLOY_PATH || '/opt/webvory' }}
          EOF

      - name: Ensure Docker Compose config is valid
        run: docker compose config

      - name: Sync repository to target server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: '.'
          target: '${{ secrets.SSH_DEPLOY_PATH }}'

      - name: Run deploy script on target server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.SSH_DEPLOY_PATH }}
            chmod +x deploy/install-server.sh deploy/deploy.sh setup.sh
            sudo deploy/install-server.sh
            sudo ./deploy/deploy.sh
